name: go-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GOTOOLCHAIN: go1.26.7

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # golangci-lint MUST read the v2 .golangci.yaml: the action's default
      # install pulls v1, which cannot parse version: "2" configs. Pin v2.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          golangci-lint run ./...

      - name: Tidy drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
