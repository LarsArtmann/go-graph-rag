name: go-test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  build-test-lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Repo policy (owner ruling "go v2", 2026-11-10): encoding/json/v2 is
      # the canonical engine — on Go 1.27 the v1 package is a compatibility
      # shim implemented on top of v2, so new code imports v2 directly and
      # the bare v1 import is forbidden everywhere (the two engines emit
      # different bytes: omitempty-on-numerics and map-key ordering).
      # Enforced since the same day the inverse rule was retired; both
      # polarities exist because daemon commits repeatedly flipped imports
      # unreviewed — whichever direction is policy, drift fails CI.
      - name: json/v2 policy check
        run: |
          matches="$(grep -rln --include='*.go' '"encoding/json"$' . || true)"
          if [ -n "$matches" ]; then
            echo "::error::encoding/json (v1 shim) import found (policy: encoding/json/v2 everywhere)"
            echo "$matches"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pin the exact patch: "1.27" resolves to the newest 1.27.x on the
          # runner (1.27.2+), whose export-data format exceeds what the pinned
          # golangci-lint v2.13.2 can decode — every typecheck import failed
          # and the Lint step went red (master, 2026-10-11..15). Bump this
          # pin together with the golangci-lint pin (CV parity rule).
          go-version: "1.27.1"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # golangci-lint MUST read the v2 .golangci.yaml: the action's default
      # install pulls v1, which cannot parse version: "2" configs. Pin v2,
      # matching the local dev-shell binary exactly (v2.13.2 could not decode
      # Go 1.27.2 export data; bump together with CV's pin).
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run ./...

      # The bdd/ test-kit module: same gates, own go.mod (replace => ../
      # resolves against this checkout), same lint config discovered from
      # the repo root, vet included because go build skips _test.go files.
      - name: BDD module build + vet
        working-directory: bdd
        run: |
          go build ./...
          go vet ./...

      - name: BDD module test
        working-directory: bdd
        run: go test -race ./...

      - name: BDD module lint
        working-directory: bdd
        run: golangci-lint run ./...

      - name: BDD module tidy drift
        working-directory: bdd
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Markdown/JSON/YAML/Dockerfile formatting; Go stays gofmt-clean.
      # Local run: nix run nixpkgs#dprint -- fmt (or dprint fmt).
      - name: Format check
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6

      - name: Tidy drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
