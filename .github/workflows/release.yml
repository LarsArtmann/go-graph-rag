name: release

# Drafted 2026-09-16 (seam-plan M9); fires only on tag pushes: core tags
# (v*) and bdd sub-module tags (bdd/v*, added 2026-11-11). Notes are
# extracted from the tag's CHANGELOG section — core strips the leading v
# (v0.5.0 -> "## [0.5.0]"), bdd keeps the full name
# (bdd/v0.1.0 -> "## [bdd/v0.1.0]"); an empty extraction fails the run
# instead of publishing a notes-less release.

on:
  push:
    tags: ["v*", "bdd/v*"]

permissions:
  contents: write

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract CHANGELOG notes for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          header="## [${version}]"
          # Plain-substring match via index(): passing the pattern through
          # awk -v would eat the \[ escapes and break the regex match.
          awk -v hdr="$header" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::no CHANGELOG section found for ${GITHUB_REF_NAME} (expected '## [${version}]')"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
